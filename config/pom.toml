# Settings shared by the whole project. Every key is optional; an unknown key or a bad value is
# logged and ignored, never fatal. Environment variables override this file:
#   POM_STRICT=1   POM_DEBUG=1   POM_LOCAL_LOGS=1   POM_LOG_LEVEL=DEBUG
#   POM_EXEMPLARS_MIN=3   POM_EXEMPLARS_MAX=5   POM_SCORER_URL=http://127.0.0.1:8098/v1/chat/completions
#
# PER-MACHINE SETTINGS AND SECRETS (the monitoring page's password, a different serial port, the Mac's log file) go in
# config/pom.local.toml, which git ignores and which overrides this file key by key. To start one:
#     cp config/pom.local.toml.example config/pom.local.toml
# Every key a local file sets must also appear in THIS file, with a safe default and a comment, so that reading this file shows
# everything that can be set. Never put a real password here: this file is committed, and the repository is public.
#
# The file is divided by the part of the Printer each setting affects, in the order of the work: GLOBAL
# first, then hearing and scoring (SCORER), deciding when to respond (QUALIFYING), then building the portent's
# prompt and asking the oracle model for it (ORACLE). (TOML needs the settings without a
# [section] to come first, so GLOBAL is at the top.)


# ================================================
# GLOBAL: affects the whole project
# ================================================

# Development and testing only: raise on every problem a module would otherwise recover from, so
# a typo is loud while you work. Leave false in the gallery.
strict = false

# Show every module's DEBUG log lines. To debug just one module, leave this false and set the
# `DEBUG = None` line at the top of that module to True (and back to None afterwards).
debug = false

# How much to log to stdout (journalctl -u pom): DEBUG, INFO, WARNING, ERROR or CRITICAL.
log_level = "INFO"

# Also write the log to logs/pom.log (gitignored, rotates at 1 MB), for working on the Mac. Leave
# false on the Pi, where journald (journalctl -u pom) already keeps the log.
local_logs = false


# ================================================
# SCORER: how interesting each sentence is
# ================================================

# The Scorer: how it reaches the local language model (a llama-server) and what it asks it.
[scorer]
# Where the model answers: a llama-server on this port, running as a service (on the Mac, started by scripts/dev/pipeline/run_printer_with_servers.py).
url = "http://127.0.0.1:8098/v1/chat/completions"

# Seconds to wait for one score before giving up on that sentence (it is left unscored). A score takes about 1 s on the Pi, but the
# first one after the server starts evaluates the whole scoring prompt (15.7 s measured), so this leaves room for it.
timeout = 30

# Sentences with fewer than this many content words (not filler, stopwords or numbers) are not sent
# to the model; they get clip_filter_score. 0 sends everything.
min_content_words = 1
clip_filter_score = 1.0

# If the model fails this many times in a row, leave it alone for retry_seconds, leaving clips
# unscored meanwhile, then try it again.
failure_limit = 3
retry_seconds = 30

# Warming up: the first request to a model that was just loaded is slow, so once the scorer's server answers, the Printer sends it one
# throwaway request, and the first real score is quick. While the server is not up yet, the Printer asks whether it is every
# warmup_poll_seconds (above 0; it is also the pause between failed warm-up requests), and gives up warming after warmup_attempts failed
# requests with the server up (a whole number of at least 1). The Printer works without the warm-up; it only makes the first score slower.
warmup_poll_seconds = 5
warmup_attempts = 3

# What the model is told. This text defines what "interesting" means and what the numbers mean, so
# it is the main thing to adjust. The model must answer with a single number; only the digit it
# starts with is read, from its probabilities. Keep it free of anything specific to one room.
prompt_scoring = """
You score how interesting a sentence is.

Each message is one sentence that someone said out loud in a room. Score how
*interesting* it is, defined as having one or more of the following content:

- a vivid or physical image
- an odd or specific detail, a name, or a number
- a human feeling: love, grief, fear, shame, desire
- a confession, a secret, or a question
- something at stake: danger, a consequence, a decision
- gossip or a judgment about someone
- something left open or unfinished, a mystery
- a surprise, a contradiction, or something strange or absurd
- death, spirits, bodies, animals, food, money, weather, or machines

A sentence is not interesting when it is ordinary talk, including greetings, filler, 
agreement, or plans and logistics.

Score how strong the interesting content is. Strong content is vivid,
specific, surprising, or deeply felt. One strong thing can score high.

Score on a scale, from 0 to 9:
0-1 not interesting: no interesting content
2-3  slightly interesting: faint content
4-5  interesting: clear content
6-7  very interesting: strong content
8-9  extremely interesting: intense content
"""

# old scale
# Score on a scale, from 1.00 to 9.99:
# 1.00-1.99  not interesting: no interesting content
# 2.00-3.99  slightly interesting: faint content
# 4.00-5.99  interesting: clear content
# 6.00-7.99  very interesting: strong content
# 8.00-9.99  extremely interesting: intense content

prompt_output = """
Reply with a one digit number and nothing else.
"""

# Reply with a single number with two decimal places from # 1.00 to 9.99 and nothing else.

prompt_output_debug = """
Output the score as a single digit | the sentence | what content you found that earned that score as a comma-separated list. Example:
6 | I'm going to cut out your heart. | vivid, anger, threat, danger, death
"""


# ================================================
# QUALIFYING: when the Printer responds
# ================================================

# The BarKeeper decides when a score is interesting enough for the Printer to respond: when it is above a bar worked out
# from the scores the room has recently earned, judged against the room as it was before the score was heard. Every score
# counts, the lowest too. There is more than one way to work out the bar, and `algorithm` picks it; each way reads only its
# own settings below, so switching is one line and the others can stay as they are. (A statistical fence was tried first.
# The scorer's numbers are lumpy, a pile at 1, humps near 3 and 5, almost nothing above 7, and a fence that guesses where
# the top should be from the middle landed above the real top in two windows out of three.)
#
#   "percentile"         the bar is a high percentile of the scores heard in the last `window_seconds`.
#   "decaying_quantile"  the bar is a high percentile of all recent scores, each counting for less the older it is (EWMQ):
#                        a zinger fades by degrees instead of holding the bar until it falls off the edge of a window.
#   "moving_average"     the bar is a set fraction above a decaying average of the scores. The first method; it has a fixed
#                        floor below which scores are ignored.
[qualifying]

algorithm = "decaying_quantile"

# Where the bar begins, before the room has said enough for one to be worked out from its own scores. It fades as the room
# speaks, so it is a starting point and not a limit. There is no silent warm-up: a score above it can qualify in the first
# minute. About the usual top of the scores on the recordings (a 99th percentile near 7).
starting_bar = 6.8

# How many seconds after a qualifier before the next score may qualify. A score above the bar inside the cooldown is held
# back (it still goes to the bar), so a burst of strong sentences, such as a run of jokes, gives one qualifier and not six.
# 0 turns it off. 0 or more.
cooldown_seconds = 60

# How much a score that stood above the bar (a qualifier, or one held back by the cooldown) influences the bar. It goes into
# what the bar is built from as the bar plus this much of the way up to the score: 1 goes in as the score itself, 0 as the
# bar itself (so it adds nothing new), 0.5 half way between. A plain number, not limited to 0 to 1, so an experiment may
# try 1.1 or -0.1. All three bars work this way.
qualifier_bar_influence = 0.75

# A line typed on the typewriter's keyboard is someone talking to the Printer directly, so it is judged against the same
# bar as the room's sentences but gets a bonus: its score is multiplied by this before it meets the bar. 1 is no bonus;
# 0 or more. The product is not capped at 9, so a typed 7 (10.5) beats any spoken 9. A typed line has no cooldown, and a
# typed line that does not clear the bar is simply ignored (nothing is printed).
typed_lines_score_multiplier = 1.5

# How much a typed line's score influences the bar. The same rule as above, with its own dial: every typed line, above the bar
# or below it, goes in as the bar plus this much of the way up to its (multiplied) score. A plain number, not limited to 0 to 1.
typed_lines_bar_influence = 0.1

# --- percentile and decaying_quantile ---

# The percentile the bar sits at: how much of the room's recent scores a score must beat. 100 means beating the best score; 99.5 lets about one score in 200
# stand above the bar; 90 means the top tenth. Above 0 and at most 100. A lower number qualifies more often.
bar_percentile = 99.5

# --- percentile ---

# How many seconds of recent scores the bar is drawn from: 300 is the last five minutes. A length of time, not a count of
# scores, so a busy room and a quiet one both get "the last five minutes". A shorter window forgets sooner. 99.5 only differs
# from 100 once the window holds about 200 scores, which a busy five minutes (about 75) does not.
window_seconds = 300

# The fewest scores the window may hold. If the room is so quiet that fewer than this were heard in the window, the window
# reaches back to the last this-many scores instead, so the bar never comes from a handful; until this many have been heard
# the bar is `starting_bar`. A whole number of at least 2.
min_scores = 20

# --- decaying_quantile ---

# How many seconds for a score to count half as much: after one half-life it counts half, after two a quarter. Decay is by
# time, so a quiet room and a busy one both remember "the last few minutes". Above 0. In replays, 300 gave about 7 qualifiers
# an hour at percentile 99.5.
half_life_seconds = 300

# How much weight the starting bar (starting_bar, above) carries when the bar first begins, counted in scores' worth: 20 is like a minute or
# two of talk. It fades on the same half-life as any score, counted from the start of the stream (when the Printer begins listening), so the bar slides from the starting bar to what
# the room really does as the room speaks. A bigger number keeps the bar near the starting bar for longer; a smaller one lets the first few
# scores set it sooner. Above 0.
starting_bar_weight = 20

# The anchor: how silence lowers the bar. Think of a click track, a steady tick that runs under the room the whole time. Each tick is a
# stand-in score that goes into the bar's memory like an attempt and fades on the same half-life. While people talk, the real scores bury
# the ticks; when the room goes quiet nothing buries them any more, and the bar settles toward this level instead of freezing at the last
# crowd's high. There is no silence detection and no cutoff: the ticks always run. Ticks never qualify, never start a cooldown, and are
# never counted as attempts.
#
# anchor_score is the value of each tick, calculated from the recordings' scores (their pooled 90th percentile). Rerun
# scripts/dev/qualifying/report_score_percentiles.py after any scorer prompt or model change. Any number.
anchor_score = 5.85

# The time between ticks, in minutes. Shorter means silence pulls the bar down faster, and talk pulls it down slightly more, since ticks add weight
# below the top. A very short interval makes every read of the bar slower, because it holds a tick for each interval across its memory. Above 0.
# Tune on replays (scripts/dev/qualifying/replay_scores_through_bar.py).
anchor_interval_minutes = 1

# How long, in minutes, the decaying_quantile bar remembers a score (or a tick). Anything older is dropped from its memory. Scores already fade with the half-life, so a
# dropped score had almost no weight; what this really decides is the end of a long quiet. Once every real score has been dropped, the bar is made of the ticks alone, so it
# is the anchor (or the starting bar, if no tick has come yet). A busy crowd's high is held until its top scores have faded to about half a percent of the weight of the ticks,
# or until this many minutes have passed, whichever comes first. Above 0. A very long memory with a very short anchor interval makes every read of the bar slower, since it
# holds a tick for each interval across the memory.
discard_scores_older_than_minutes = 120

# --- moving_average ---

# How far above the decaying average of the scores the bar sits: 0.25 is 25% above. 0 or more.
average_fraction = 0.25

# How many more scores it takes for a score's influence on the average to halve (decay is by score, not by time). Above 0.
average_half_life_scores = 10

# How far up the 0 to 9 scale the floor sits: scores below it are ignored and never feed the average. 0.05 is 0.45. From 0 up
# to but not including 1. A fixed line, which the other methods avoid.
average_floor_fraction = 0.05


# ================================================
# LISTENING: how the Printer hears the room
# ================================================

# These are the numbers of the combination that worked in the room: whisper base.en with its voice detection at 0.5,
# a whisper run every 5 seconds on a rolling buffer. A test pins them, so a change here is noticed. Change one at a
# time. (The microphone's capture gain, 24 of 30, is not here: it resets on every reboot, so startup sets it.)
[listening]

# Where the whisper-server answers, and how long to wait for one transcription, in seconds.
whisper_url = "http://127.0.0.1:8110"
whisper_timeout = 180

# The microphone, as arecord's -D takes it (arecord -l lists them), and how many seconds of sound are held for it. If
# the Printer falls that far behind, the oldest sound is dropped.
device = "plughw:0,0"
buffer_seconds = 10

# Whisper is asked about the audio every `cut_every_seconds`. A finished segment is kept once it ends `hold_back_seconds` before
# the end of what whisper was given, so a thought still going is not cut in two. `rewind_seconds` starts each run that many
# seconds before the last kept segment's end (0 is off; it made whisper repeat the last word). A stretch of talk that
# runs past `max_cut_seconds` without finishing is forced out.
cut_every_seconds = 5
hold_back_seconds = 2
rewind_seconds = 0
max_cut_seconds = 30

# The most words one clip may have, a whole number of at least 1. Whisper's punctuation is what cuts speech into sentences, clauses and
# phrases to be scored. A run of words with no punctuation at all is cut into consecutive windows of this many words, so a hinge is always a
# bounded size. 40 was the first guess, and nothing since has tested it: in the recordings about one clip in eighty came out at exactly 40.
max_clip_words = 40

# The voice detector treats singing and most sounds as not speech. After this many runs in a row with no speech, whisper
# is asked once, without it, about the last `room_tone_pass_seconds` of sound, and only lyrics and room tone like "(dog barks)"
# are kept. 0 turns it off. (It can only hear what is still held, which after a quiet stretch is about two seconds.)
room_tone_pass_every = 3
room_tone_pass_seconds = 10

# How many of the latest bits of room tone to remember, to tell the oracle model what the room sounds like.
room_tone_memory = 6

# Whether room tone, like "(dog barks)", may be scored and become hinges the way speech does. The
# Printer reacts to what is happening around it, and a dog barking may be all that is happening. Off by default: how
# room tone scores has not been tried, and whisper sometimes invents it. Speech and lyrics are scored either way.
score_room_tone = false


# ================================================
# ORACLE: the model that writes the portent
# ================================================

[oracle]
# How many library passages go into each pull of exemplars: a random number from exemplars_min to
# exemplars_max, inclusive. Both must be whole numbers of at least 1.
exemplars_min = 1
exemplars_max = 1

# The oracle copies its exemplar's ending, so an exemplar that stops before its thought is done (it ends on a colon, or on a word like
# "the" or "of") makes a portent that stops there too. A pick that lands on one is drawn again; this is how many times, for one pick,
# before the unfinished one is used anyway (so a library full of them still answers). 0 turns it off. A whole number, 0 or more.
exemplar_redraws = 50

# What the model is given. {exemplars} is replaced by a few library passages drawn at random, and {hinge} by
# the clip that qualified, word for word. Nothing else is added, so everything the model needs to
# be told goes here.

prompt = """
You are creating a new passage.

## IMPORTANT RULES
- DO NOT print the theme in your passage.
- DO NOT print the style example in your passage.
- Match the form, tone, and length of the style example.
- Do not include any introductory text, titles, quotes, or explanations.
- Limit to less than 150 words.

## STEP 1: STUDY THE STYLE EXAMPLE
Use the example below for the style of your passage:

{exemplars}

## STEP 2: APPLY THE THEME
In the style of the example, create a single passage inspired by this theme without using the theme text.

{hinge}
"""

# How the oracle model is reached: a second llama-server on this port, apart from the scorer's, run the same way.
url = "http://127.0.0.1:8099/v1/chat/completions"

# Seconds to wait for one portent before giving up. Writing is slow on the Pi (about half a second a token), and the whole reply
# is waited for at once, so this must cover the longest portent the model can write: max_tokens (below) at that speed, plus the
# time to read the prompt. Too short and the longest portents are lost to it. The Conductor's watchdog for writing must be longer.
timeout = 240

# The most the model may write for one portent, counted in tokens (about 3/4 of a word each). A portent
# is 15 to 150 words; this only stops a runaway.
max_tokens = 300

# How adventurous the model's word choice is. 0 always takes the likeliest word; higher is more varied.
temperature = 0.8


# ================================================
# MONITOR: a web page of the last hour of turns
# ================================================

# Open it from another machine on the same network, for example http://pom1.local:8080 . It shows the newest turns
# first and, for each, the hinge, the exemplars the oracle was shown, the portent, the score and the bar. The hinge is
# what someone said in the room, so the page keeps it in memory only, for the hour, and asks for a password.
[monitor]

# Whether the site starts with the Printer.
enabled = false

# The address it listens on. 0.0.0.0 means every network interface, so anyone on the local network can reach the login.
host = "0.0.0.0"

# The port it listens on, 1 to 65535.
port = 8080

# The password. The site will not start while this is empty. DO NOT put the real one here: pom.toml is committed to a
# public repository. Put `password = "..."` under [monitor] in config/pom.local.toml, which git ignores.
password = ""

# true shows the hinge on the page; false shows numbers only (time, score, bar, window) and the exemplars and portent.
show_hinges = true

# How many seconds a turn stays on the page. It is kept in memory only, so a restart empties it. Above 0.
history_seconds = 3600

# The most turns the page keeps, a whole number of at least 1. A safety limit: age (history_seconds above) normally ends a turn first, so a flood of turns
# cannot fill the Pi's memory. If it is too low, a busy room's turns are dropped before they are an hour old; too high only lets the history grow.
history_max_turns = 500

# How many characters of a hinge the list of turns shows before cutting it with an ellipsis (the whole hinge is on the turn's own page), a whole number of at
# least 1. Higher shows more of each hinge and makes the rows of the list longer; lower makes the list tighter and shows less of what was said.
hinge_snippet_chars = 90

# How often, at most, the page's service lights (whisper, scorer, oracle) are checked, in seconds, above 0. The page polls every few seconds
# while it is open; this keeps that from hammering the servers. A longer time makes a server's going down show later.
service_check_seconds = 15

# How often, in seconds, the open page asks for news and redraws itself: the chart, the status tiles and the turns all move together on this beat.
# Above 0. Shorter makes the graph and tiles move more smoothly and costs the Pi a little more work for each open page; longer makes them lag.
poll_seconds = 5

# Whether a request from the Printer's own machine (its own display, the kiosk) needs the password too. true asks everyone; false lets the
# Printer's own screen in without one, so no password has to be kept in the kiosk's settings. Everyone else on the network still needs it, and so does
# anything that arrives through a proxy on the Printer (which would otherwise look like the Printer itself). A missing or bad value means true.
password_on_localhost = false

# The most entries the chart's notebook keeps, a whole number of at least 1. The notebook holds one entry for every attempt and every tick, and drops the
# old ones by age first (it keeps what the chart can show, window_minutes in [chart] below, about 30 minutes of data); this is only the safety limit, so a flood of
# attempts cannot fill the Pi's memory. If it is too low, a busy room's chart is cut short on the left (30 minutes of a room scored every 15 seconds is about
# 120 attempts plus 30 ticks); too high only lets the notebook grow.
chart_notebook_max_entries = 5000


# ================================================
# CHART: the monitoring page's picture of the room's scores and the bar
# ================================================

# The page draws the last stretch of attempts as dots, the bar each one had to beat as a line, and the qualifiers as larger dots. Everything
# that shapes the drawing is here. Colors are not: they belong to the page and follow its light and dark theme. The drawing is a picture with its own
# coordinate space (drawing_width by drawing_height); it is scaled to the width of the page, so these are proportions, not pixels.
[chart]

# How much time the chart shows, back from now, in minutes (above 0). The page's caption says it. A long silence is drawn short (below), so after one the
# chart reaches back further in real time than this.
window_minutes = 30

# A silence (a stretch with no attempt) longer than this many minutes is drawn this wide, with its real length written over it (above 0).
# Higher shows long silences closer to their true size; lower squeezes them more and fits more of the room's history into the same chart.
longest_silence_minutes = 10

# A silence is drawn like a broken part in an engineering drawing: a clear gap with a zigzag on each edge. This is the zigzag's height, above 0.
break_mark_size = 6

# The width of the clear gap between the two break marks, in the drawing's units (above 0). The words sit in it, so keep it wide enough for them; the rest
# of a silence shows on either side, the bar sliding down through it. A silence narrower than this is all gap.
break_gap_width = 64

# A faint vertical line this often, in minutes (above 0). The time axis says so in words, "Intervals at approximately 5 min", approximately because a silence
# is drawn short.
gridline_every_minutes = 5

# The top of the score scale (the bottom is 0): the scorer answers 0 to 9. A score outside the scale is drawn at the edge. And which scores get a
# horizontal line and a label, as a list.
score_max = 9
score_gridlines = [0, 3, 6, 9]

# The drawing's own size, and the room left around the plot for the labels (0 or more). The left margin holds the score labels and the bottom
# margin the time labels; the margins must leave some room for the plot.
drawing_width = 720
drawing_height = 150
margin_left = 24
margin_right = 6
margin_top = 8
margin_bottom = 18

# The radius of the dot for an attempt, of the larger dot for a qualifier, and the width of the line that is the bar (all above 0).
attempt_dot_radius = 1.8
qualifier_dot_radius = 4
bar_line_width = 1.6


# ================================================
# DISPLAY: the kiosk, the monitoring page on a monitor plugged into the Printer
# ================================================

# When a monitor is plugged into the Pi, pom-display.service (scripts/setup/systemd/) shows the monitoring page on it full-screen, in a browser run
# by cage, a one-window compositor. With no monitor it does nothing, and the Printer never notices either way. The page is the same one served on
# the network, asked for from the Printer itself, so [monitor] enabled must be true and [monitor] password_on_localhost false (the screen has no keyboard to
# type a password with). Install what it needs with scripts/setup/setup-kiosk.sh.
[display]

# The browser's command, a name on the path or a full path.
browser = "chromium"

# The flags it is started with, one text each. --kiosk is full-screen with no window frame or address bar; the others keep it from showing error
# bubbles or first-run pages, run it on Wayland (the compositor's own display system), and stop it asking for a keyring password. The browser's profile
# folder and the page's address are added after these.
browser_flags = ["--kiosk", "--noerrdialogs", "--disable-infobars", "--disable-session-crashed-bubble", "--no-first-run", "--ozone-platform=wayland", "--password-store=basic"]

# Where the browser keeps its own settings and cache: a folder of its own, so the kiosk is never mixed up with another use. ~ is the home directory.
browser_profile_dir = "~/.config/pom-kiosk"


# ================================================
# PRINTING: how a portent is set on the page
# ================================================

# The PortentFormatter wraps each portent to a line of characters. The width is worked out from the paper and the
# print wheel: (paper width - 2 x margin) x characters per inch, rounded down. 8.5 inch paper with 1 inch margins at 10
# characters per inch is 65 characters; at 12 it is 78, and at 15 it is 97.
[printing]

# The paper's width in inches, above 0.
paper_width_inches = 8.5

# The margin on each side in inches, 0 or more. These are the margins the typewriter is set to; the Printer does not
# set them. The paper, margins and pitch must leave a line of at least 20 characters.
margin_inches = 1.0

# The print wheel's pitch: 10, 12 or 15 on the Wheelwriter. The machine's pitch switch must match the wheel. 10 is the
# widest letters, so the shortest line, and fits any wheel.
characters_per_inch = 10

# How many spaces a quotation (text the model put in triple backticks) is indented. 0 or more.
quote_indent = 4

# How many line feeds are typed after each portent, 0 or more. The first ends the last line; the rest are blank lines,
# so the paper has moved on when the next portent is typed.
linefeeds_after_portent = 4

# Most print wheels lack nine ASCII characters: < > \ ^ ` { | } ~. The CadetWriter builds them from periods and
# micro-movements ("period graphics"), which is correct but slow and dotty. < and > can carry meaning and are rare, so
# they are always typed that way. The other seven are swapped for a look-alike so the typing stays quick (` becomes ',
# ~ becomes -, { } become ( ), \ and | become /, ^ is left out). List here any of those seven to type as they are
# instead, for example "^|". Empty swaps all seven.
keep_composed_characters = ""

# true if the wheel is one of the rare ASCII wheels (IBM/Lexmark Courier 10, P/N 1353909) that has all nine. Then every
# one is typed as it is, whatever keep_composed_characters says. (This is not CadetWriter's own setting of that name.)
ascii_printwheel = false


# ================================================
# TERMINAL: the serial connection to the typewriter
# ================================================

# The Wheelwriter, converted with the CadetWriter board, acts as a serial terminal. The Printer sends each portent to it
# over a serial port, no faster than the typewriter can type. These must match the CadetWriter's own settings
# (its SetUp mode; see its user guide, section 3).
[terminal]

# The serial device. /dev/ttyACM0 is the CadetWriter's USB port on the Pi; check with `ls /dev/ttyACM*` after plugging it in.
# It may be a pattern, such as "/dev/ttyACM*" or "/dev/serial/by-id/usb-*": it is looked up each time the port is opened, so a
# printer that comes back under another name (ttyACM0, then ttyACM1) is found.
port = "/dev/ttyACM0"

# The speed. Only the CadetWriter's RS-232 port uses it (its default is 9600); the USB port ignores it.
baud = 9600

# "xon_xoff" (the CadetWriter's default), "rts_cts" or "none". Without flow control a flood of text is lost.
flow_control = "xon_xoff"

# What a newline is sent as: "cr", "crlf", "lf" or "lfcr". Must match the CadetWriter's "receive end-of-line"
# setting, whose default is "crlf". A bare LF only feeds the paper, so each line would step down the page.
end_of_line = "crlf"

# The fastest the text is sent, in characters a second, above 0. The Wheelwriter types about 16; a little under keeps
# the CadetWriter's small buffer nearly empty. To be measured on the machine.
characters_per_second = 16

# Seconds to wait after the last character for the typewriter to finish the line, 0 or more. Listening waits too.
finish_wait_seconds = 2

# Someone at the typewriter's keyboard can type back. In its default full-duplex mode the CadetWriter sends each key to
# the Pi and prints nothing itself, so the Pi decides what reaches the paper. true echoes each key back as it arrives
# ("echoplex", the old terminal name for it); then the CadetWriter must be in full duplex, its default. false leaves the
# echo to the CadetWriter, which must then be in half duplex. A mismatch types every character twice, or none.
echoplex = true

# false throws away keys pressed while a portent is being typed (and any half-typed line), so nothing typed over a
# portent appears after it. true keeps them and handles them once the portent is done.
type_during_printing = false

# Once a portent is being typed, how long (in seconds, above 0) to wait for a typewriter that stopped taking characters (held,
# out of paper, busy) or went away (unplugged). When it comes back the portent goes on where it stopped, with nothing repeated.
# Too short and a printer you are refilling with paper loses the rest of the portent; too long only means a dead printer holds
# the Printer deaf for that long. A portent not yet started is waited for much less (the Conductor's freshness limit).
stall_patience_seconds = 600

# How often (in seconds, above 0) a lost port is tried again while waiting.
reconnect_seconds = 2

# A line typed on the typewriter's keyboard is ended at this many characters, so a stuck key cannot grow it without limit. A whole number of at
# least 1. Far longer than any line anyone types.
max_typed_line_characters = 500

# The pause, in seconds (above 0), before a character the machine refused (its buffer is full, or it is held) is sent again.
refused_character_retry_seconds = 1

# While the Printer waits for a machine that has stalled, been held, run out of paper or gone away, it mentions the wait in the log this
# often, in seconds (above 0). It only sets how chatty the log is.
wait_log_reminder_seconds = 60

# What the Printer prints on. "serial" is the real typewriter (the port above). "console" types on the screen at the same
# pace, for development. "none" means no printer at all: a turn is write the portent, show it on the monitoring site, done,
# so the Printer can be watched listening and writing with nothing attached.
mode = "serial"


# ================================================
# CONDUCTOR: running a turn, and how long each part of it may take
# ================================================
# The Printer prints what it writes, and listens only to find something to print. So every limit below errs LONG:
# too short and a healthy, slow turn is cut off while it is still working (the ears reopen while the typewriter is still
# typing, and the Printer hears itself; the longest portents are lost, and it says only short and medium ones). Too long
# only means a turn that is really stuck keeps the Printer deaf for that long. All of these are seconds.
[conductor]

# The watchdog's limit for the oracle to write one portent. Must be LONGER than [oracle] timeout, which gives up first.
writing_seconds = 300

# The watchdog's limit for formatting and typing one portent. A wait for the printer sends a heartbeat that restarts this
# clock, so it only has to cover the longest portent at the typewriter's pace (300 tokens is about 90 seconds at 16
# characters a second).
printing_seconds = 180

# After a turn the ears stay shut this long (0 or more), so the typewriter's last sounds die away before listening resumes.
recovering_seconds = 3

# A portent answers one sentence; a few minutes later the room has moved on. How long after its hinge a portent is still
# worth printing (above 0). If the printer cannot print by then (unplugged, held, out of paper), the portent is dropped.
# A little under the usual gap between portents (6 to 8 minutes).
freshness_seconds = 360

# If the oracle writes nothing (its server is down or slow), how many times to ask in one turn (at least 1), how long to
# wait between asks (0 or more), and the time all the writing may take. Another ask is made only if a whole one (the
# oracle's timeout) still fits in the budget, so a quick failure is asked again and a timeout is not. Keep the budget
# under writing_seconds.
write_attempts = 3
write_pause_seconds = 10
write_budget_seconds = 270

# While the typewriter cannot print yet, how long to wait between tries (above 0). It keeps trying until the portent
# is no longer fresh.
print_pause_seconds = 10

# If the microphone stops (unplugged) or the keyboard watcher fails, how long to wait before starting it again (0 or more).
restart_pause_seconds = 5

# How often the Conductor looks at the floor to open the ears again and at its own threads (above 0).
check_seconds = 1


# ================================================
# BOOT SLIP: what the typewriter types when it comes online
# ================================================

# Every time the Printer starts (on the Pi, every boot) and the typewriter is online, the typewriter types a short slip that
# looks like a terminal announcing itself, and one line of it is the address the Pi has, so the monitoring page and ssh can be
# reached without a screen. It waits in the background (the Printer listens meanwhile), types as soon as the typewriter is
# there, whether or not the Pi has a network, and the Printer is deaf only while it types. With no terminal (--terminal none) it
# types nothing.
[boot_slip]

# true types the slip. false types nothing at start-up.
enabled = true

# The slip's words, set for the paper like a portent (a line too long wraps; several spaces in a row become one). {address} is
# replaced by the Pi's IPv4 address, every usable one if it has more than one (the home network's and the Comitup hotspot's),
# or by 127.0.0.1 if it has none; {hostname} by the machine's name.
text = """
CADETWRITER - IBM-1620
MODE ......... TERMINAL
SELF TEST .... OK
LINE 1 ....... {address}
ON LINE
"""

# Once the typewriter is online, how many seconds to wait for the Pi to get an address (Wi-Fi may come up after the Printer
# does) before typing without one. 0 or more. It types at once if an address is already there.
address_grace_seconds = 15

# How often, in seconds, to ask whether the typewriter is online, and whether the floor is free (a portent may be printing).
# 0 or more.
retry_seconds = 5
