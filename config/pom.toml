# Settings shared by the whole project. Every key is optional; an unknown key or a bad value is
# logged and ignored, never fatal. Environment variables override this file:
#   POM_STRICT=1   POM_DEBUG=1   POM_LOCAL_LOGS=1   POM_LOG_LEVEL=DEBUG
#   POM_SAMPLES_MIN=3   POM_SAMPLES_MAX=5   POM_SCORER_URL=http://127.0.0.1:8098/v1/chat/completions
#
# The file is divided by the part of the Printer each setting affects. (TOML needs the settings
# without a [section] to come first, so GLOBAL and ORACLE sit at the top.)


# ================================================
# GLOBAL: affects the whole project
# ================================================

# Development and testing only: raise on every problem a module would otherwise recover from, so
# a typo is loud while you work. Leave false in the gallery.
strict = false

# Show every module's DEBUG log lines. To debug just one module, leave this false and set the
# `DEBUG = None` line at the top of that module to True (and back to None afterwards).
debug = false

# How much to log to stdout (journalctl -u pom): DEBUG, INFO, WARNING, ERROR or CRITICAL.
log_level = "INFO"

# Also write the log to logs/pom.log (gitignored, rotates at 1 MB), for working on the Mac. Leave
# false on the Pi, where journald (journalctl -u pom) already keeps the log.
local_logs = false


# ================================================
# ORACLE: exemplars drawn from the corpus
# ================================================

# How many corpus chunks go into each pull of exemplars: a random number from samples_min to
# samples_max, inclusive. Both must be whole numbers of at least 1.
samples_min = 3
samples_max = 5


# ================================================
# SCORER: how interesting each sentence is
# ================================================

# The Scorer: how it reaches the local language model (a llama-server) and what it asks it.
[scorer]
# Where the model answers. The entry point starts llama-server on this port.
url = "http://127.0.0.1:8098/v1/chat/completions"

# Seconds to wait for one score before giving up on that sentence (the word-tool fallback is used).
timeout = 15

# Sentences with fewer than this many content words (not filler, stopwords or numbers) are not sent
# to the model; they get the floor score. 0 sends everything.
min_content_words = 1
floor = 1.0

# If the model fails this many times in a row, leave it alone for retry_seconds, scoring with the
# word-tool fallback meanwhile, then try it again.
failure_limit = 3
retry_seconds = 30

# What the model is told. This text defines what "interesting" means and what the numbers mean, so
# it is the main thing to adjust. The model must answer with a single number; only the digit it
# starts with is read, from its probabilities. Keep it free of anything specific to one room.
prompt_scoring = """
You score how interesting a sentence is.

Each message is one sentence that someone said out loud in a room. Score how
*interesting* it is, defined as having one or more of the following content:

- a vivid or physical image
- an odd or specific detail, a name, or a number
- a human feeling: love, grief, fear, shame, desire
- a confession, a secret, or a question
- something at stake: danger, a consequence, a decision
- gossip or a judgment about someone
- something left open or unfinished, a mystery
- a surprise, a contradiction, or something strange or absurd
- death, spirits, bodies, animals, food, money, weather, or machines

A sentence is not interesting when it is ordinary talk, including greetings, filler, 
agreement, or plans and logistics.

Score how strong the interesting content is. Strong content is vivid,
specific, surprising, or deeply felt. One strong thing can score high.

Score on a scale, from 1.00 to 9.99:
1.00-1.99  not interesting: no interesting content
2.00-3.99  slightly interesting: faint content
4.00-5.99  interesting: clear content
6.00-7.99  very interesting: strong content
8.00-9.99  extremely interesting: intense content
"""

prompt_output = """
Reply with a single number with two decimal places from 1.00 to 9.99 and nothing else.
"""

prompt_output_debug = """
Output the score as a single number with two decimal places from 1.00 to 9.99 | the sentence | what content you found that earned that score as a comma-separated list. Example:
6.00 | I'm going to cut out your heart. | vivid, anger, threat, danger, death
"""