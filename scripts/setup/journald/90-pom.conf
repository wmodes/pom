# Keep the log across reboots, with a size cap: journald does the rotation. Raspberry Pi OS ships a drop-in that makes the journal volatile
# (lost at every reboot); this one sorts after it and wins. Linked into /etc/systemd/journald.conf.d/ by scripts/setup/install-services.sh.
# For an installation that runs unattended, the log from before a crash is the whole point of having one. `journalctl -u pom` reads it.
[Journal]
Storage=persistent
SystemMaxUse=500M
SystemKeepFree=1G
MaxRetentionSec=1month
