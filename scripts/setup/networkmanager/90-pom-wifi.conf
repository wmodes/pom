# Wi-Fi power saving off. A radio that sleeps between the access point's beacons can miss broadcast and multicast traffic (ARP, mDNS),
# and a sleeping Pi can look unreachable. The Printer runs unattended on whatever Wi-Fi it is given, so it stays awake.
# Linked into /etc/NetworkManager/conf.d/ by scripts/setup/install-services.sh. wifi.powersave: 0 default, 1 ignore, 2 disable, 3 enable.
[connection]
wifi.powersave = 2
